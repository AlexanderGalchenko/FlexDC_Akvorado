---
services:
  geoip:
    extends:
      file: versions.yml
      service: ipinfo-geoipupdate
    environment:
      - IPINFO_TOKEN=${IPINFO_TOKEN:?Set IPINFO_TOKEN in your local environment before enabling IPinfo}
      - IPINFO_DATABASES=country asn
      - UPDATE_FREQUENCY=48h
    volumes:
      - akvorado-geoip:/data
