---
services:
  # Compatibility profile for Akvorado 1.11.3.
  # Legacy Bitnami images are archived, without further security updates.
  # Plan their replacement together with the Akvorado major-version migration.
  # main services
  zookeeper:
    image: bitnamilegacy/zookeeper:3.8 # \d+\.\d+
  kafka:
    image: bitnamilegacy/kafka:3.7 # \d+\.\d+
  redis:
    image: bitnamilegacy/valkey:7.2 # \d+\.\d+
  clickhouse:
    image: clickhouse/clickhouse-server:24.8 # \d+\.[38]
  traefik:
    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
  maxmind-geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7
  ipinfo-geoipupdate:
    image: ghcr.io/akvorado/ipinfo-geoipupdate:latest
    build:
      context: .
      dockerfile: Dockerfile.ipinfo-geoipupdate
  akvorado:
    image: ghcr.io/akvorado/akvorado:1.11.3

  # observability
  grafana:
    image: grafana/grafana-oss:10.2.6 # \d+\.\d+\.\d+
  prometheus:
    image: prom/prometheus:v2.47.2 # v\d+\.\d+\.\d+
  node-exporter:
    image: prom/node-exporter:v1.7.0 # v\d+\.\d+\.\d+
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:0
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2 # v\d+\.\d+\.\d+

  # for tests
  srlinux:
    image: ghcr.io/nokia/srlinux:23.10.6
  postgres:
    image: bitnami/postgresql:16.3.0 # \d+\.\d+\.0
  mysql:
    image: bitnami/mariadb:11.3 # \d+\.\d+
