worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        location = /__isp/branding-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /__isp/branding.js {
            alias /usr/share/nginx/html/branding.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff;
        }

        location / {
            # Resolve again after the console is recreated during an upgrade.
            set $console akvorado-console:8080;
            proxy_pass http://$console;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;

            # sub_filter defaults to text/html: JavaScript, JSON and assets are untouched.
            sub_filter_once on;
            sub_filter '<title>Akvorado</title>' '<title>ISP-BGP Monitoring</title>';
            sub_filter '</head>' '<script src="/__isp/branding.js?v=1" defer></script></head>';
        }
    }
}
